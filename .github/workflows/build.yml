name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android
        run: bash tool/setup_android.sh

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk gazmap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gazmap-apk
          path: gazmap.apk

      - name: Versão do app
        id: ver
        run: echo "tag=v$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      # Publica (ou atualiza) a versão do pubspec a cada push na main.
      # O link .../releases/latest/download/gazmap.apk sempre aponta para ela.
      - name: Publicar versão
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: GAZMAP ${{ steps.ver.outputs.tag }} · POWERED BY GAZIRE
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: gazmap.apk
          body: |
            App de trilhas livre, gratuito e offline.
            Instalação: https://www.gazire.com.br/gazmap
