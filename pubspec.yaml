name: gazmap
description: "GAZMAP — app de trilhas livre e aberto: grave suas atividades com GPS, online e offline."
publish_to: 'none'
version: 0.3.2+9

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_tts: ^4.0.2
  share_plus: ^10.1.0
  permission_handler: ">=11.3.0 <13.0.0"
  url_launcher: ^6.3.0
  battery_plus: ">=6.0.0 <8.0.0"
  pedometer: ^4.0.0
  image_picker: ^1.1.0
  nearby_connections: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
